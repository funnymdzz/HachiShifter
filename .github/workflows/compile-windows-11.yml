name: Compile Windows 11 x64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-windows-11-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HACHISHIFTER_SKIP_FRONTEND_BUILD: "1"
  RUSTFLAGS: "-Awarnings"

jobs:
  compile-windows-11:
    # GitHub does not provide a hosted Windows 11 x64 runner. The Windows
    # Server 2025 image uses the same x64 MSVC target and produces binaries
    # suitable for Windows 11 x64.
    name: Windows 11 compatible x64 (ONNX + vslib)
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          cache: false

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-x86_64-cargo-${{ hashFiles('backend/src-tauri/Cargo.lock') }}

      - name: Verify native build tools
        shell: pwsh
        run: |
          cmake --version
          rustc --version
          cargo --version

      - name: Build frontend
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Fetch SoundTouch source
        shell: bash
        run: |
          set -euo pipefail
          destination="backend/src-tauri/third_party/soundtouch-static/soundtouch"
          if [ -f "$destination/CMakeLists.txt" ]; then
            exit 0
          fi
          mkdir -p "$(dirname "$destination")"
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 --branch 2.3.3 \
              https://codeberg.org/soundtouch/soundtouch.git "$destination"; then
              exit 0
            fi
            rm -rf "$destination"
            sleep $((attempt * 2))
          done
          echo "SoundTouch clone failed after five attempts" >&2
          exit 1

      - name: Compile Windows 11 compatible release
        working-directory: backend/src-tauri
        shell: pwsh
        run: |
          cargo build `
            --release `
            --target x86_64-pc-windows-msvc `
            --no-default-features `
            --features onnx,vslib,custom-protocol `
            --locked

      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\scripts\pack-portable.ps1 -SkipBuild

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: HachiShifter-windows-11-x86_64
          path: dist/*portable-win-x64.zip
          if-no-files-found: error
