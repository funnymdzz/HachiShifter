name: Compile Linux x86_64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HACHISHIFTER_SKIP_FRONTEND_BUILD: "1"
  RUSTFLAGS: "-Awarnings"

jobs:
  compile-linux:
    name: Linux x86_64 (ONNX, no vslib)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: false

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-x86_64-cargo-${{ hashFiles('backend/src-tauri/Cargo.lock') }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Fetch SoundTouch source
        shell: bash
        run: |
          set -euo pipefail
          destination="backend/src-tauri/third_party/soundtouch-static/soundtouch"
          if [ -f "$destination/CMakeLists.txt" ]; then
            exit 0
          fi
          mkdir -p "$(dirname "$destination")"
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 --branch 2.3.3 \
              https://codeberg.org/soundtouch/soundtouch.git "$destination"; then
              exit 0
            fi
            rm -rf "$destination"
            sleep $((attempt * 2))
          done
          echo "SoundTouch clone failed after five attempts" >&2
          exit 1

      - name: Compile Linux release without vslib
        working-directory: backend/src-tauri
        run: |
          cargo build \
            --release \
            --target x86_64-unknown-linux-gnu \
            --no-default-features \
            --features onnx \
            --locked

      - name: Verify and package Linux binary
        shell: bash
        run: |
          set -euo pipefail
          release_dir="backend/src-tauri/target/x86_64-unknown-linux-gnu/release"
          test -x "$release_dir/HachiShifter"
          test -f "$release_dir/libSoundTouchDLL.so"
          if ldd "$release_dir/HachiShifter" | grep -q "not found"; then
            ldd "$release_dir/HachiShifter"
            exit 1
          fi

          package_dir="dist/HachiShifter-linux-x86_64"
          mkdir -p "$package_dir"
          cp "$release_dir/HachiShifter" "$package_dir/"
          cp "$release_dir/libSoundTouchDLL.so" "$package_dir/"
          cp LICENSE "$package_dir/"
          cp -R backend/src-tauri/resources/models "$package_dir/models"
          tar -czf dist/HachiShifter-linux-x86_64.tar.gz -C dist HachiShifter-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: HachiShifter-linux-x86_64
          path: dist/HachiShifter-linux-x86_64.tar.gz
          if-no-files-found: error
